name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Please NOTE: VITE_ANTHROPIC_API_KEY is intentionally NOT passed here.
      # Vite inlines VITE_* vars into the built JS bundle, so setting it
      # here would ship a readable Anthropic API key on the public
      # GitHub Pages site. The chat feature falls back gracefully to
      # rule-based insights when no key/backend is configured. If you
      # want live chat without a backend, set a strict spending cap on
      # the key in the Anthropic Console first, then re-add this line.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4